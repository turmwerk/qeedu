services:
  mysql:
    image: mysql:8
    container_name: edu-ai-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: nju_edu_ai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p123456"]
      interval: 5s
      timeout: 3s
      retries: 30

  user-services:
    build:
      context: ../
      dockerfile: user-services/Dockerfile
      network: host
    container_name: edu-ai-user-services
    restart: unless-stopped
    expose:
      - "50051"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_DSN: "root:123456@tcp(mysql:3306)/nju_edu_ai?charset=utf8mb4&parseTime=True&loc=Local"
      GRPC_ADDR: ":50051"

  sandbox:
    build:
      context: ../
      dockerfile: sandbox/Dockerfile
      network: host
    container_name: edu-ai-sandbox
    restart: unless-stopped
    expose:
      - "50052"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      GRPC_ADDR: ":50052"
      DOCKER_HOST: "unix:///var/run/docker.sock"

  ai-copilot:
    build:
      context: ../
      dockerfile: ai-copilot/Dockerfile
    container_name: edu-ai-copilot
    restart: unless-stopped
    expose:
      - "50053"
    volumes:
      - ../configs/llm.json:/app/configs/llm.json:ro
    environment:
      GRPC_PORT: "50053"

  ai-chat:
    build:
      context: ../
      dockerfile: ai-chat/Dockerfile
    container_name: edu-ai-chat
    restart: unless-stopped
    expose:
      - "50054"
    volumes:
      - ../configs/llm.json:/app/configs/llm.json:ro
      - /root/.codex:/root/.codex
      - /usr/lib/node_modules/@openai/codex:/usr/lib/node_modules/@openai/codex:ro
    environment:
      GRPC_PORT: "50054"
      LLM_FALLBACK_PROVIDER: "${LLM_FALLBACK_PROVIDER:-codex}"
      CODEX_BIN: "/usr/lib/node_modules/@openai/codex/bin/codex.js"
      CODEX_HOME: "/root/.codex"
      CODEX_WORKDIR: "/tmp"
      CODEX_REASONING_EFFORT: "${CODEX_REASONING_EFFORT:-low}"
      CODEX_REASONING_SUMMARY: "${CODEX_REASONING_SUMMARY:-none}"
      CODEX_VERBOSITY: "${CODEX_VERBOSITY:-low}"
      LLM_CLI_TIMEOUT_SECONDS: "${LLM_CLI_TIMEOUT_SECONDS:-240}"

  gateway:
    build:
      context: ../
      dockerfile: gateway/Dockerfile
      network: host
    container_name: edu-ai-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      user-services:
        condition: service_started
      sandbox:
        condition: service_started
      ai-copilot:
        condition: service_started
      ai-chat:
        condition: service_started
    env_file:
      - ../.env
    volumes:
      - gateway-uploads:/app/uploads
    environment:
      DATABASE_DSN: "root:123456@tcp(mysql:3306)/nju_edu_ai?charset=utf8mb4&parseTime=True&loc=Local"
      USER_SERVICE_ADDR: "user-services:50051"
      SANDBOX_SERVICE_ADDR: "sandbox:50052"
      AI_COPILOT_SERVICE_ADDR: "ai-copilot:50053"
      AI_CHAT_SERVICE_ADDR: "ai-chat:50054"

volumes:
  mysql-data:
  gateway-uploads:
