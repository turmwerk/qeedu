services:
  mysql:
    image: mysql:8
    container_name: nju-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: nju_edu_ai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p123456"]
      interval: 5s
      timeout: 3s
      retries: 30

  user-services:
    build:
      context: ../
      dockerfile: user-services/Dockerfile
    container_name: nju-user-services
    restart: unless-stopped
    ports:
      - "50051:50051"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_DSN: "root:123456@tcp(mysql:3306)/nju_edu_ai?charset=utf8mb4&parseTime=True&loc=Local"
      GRPC_ADDR: ":50051"

  sandbox:
    build:
      context: ../
      dockerfile: sandbox/Dockerfile
    container_name: nju-sandbox
    restart: unless-stopped
    ports:
      - "50052:50052"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      GRPC_ADDR: ":50052"
      DOCKER_HOST: "unix:///var/run/docker.sock"

  ai-copilot:
    build:
      context: ../
      dockerfile: ai-copilot/Dockerfile
    container_name: nju-ai-copilot
    restart: unless-stopped
    ports:
      - "50053:50053"
    env_file:
      - ../.env
    environment:
      GRPC_PORT: "50053"

  ai-chat:
    build:
      context: ../
      dockerfile: ai-chat/Dockerfile
    container_name: nju-ai-chat
    restart: unless-stopped
    ports:
      - "50054:50054"
    env_file:
      - ../.env
    environment:
      GRPC_PORT: "50054"

  gateway:
    build:
      context: ../
      dockerfile: gateway/Dockerfile
    container_name: nju-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      user-services:
        condition: service_started
      sandbox:
        condition: service_started
      ai-copilot:
        condition: service_started
      ai-chat:
        condition: service_started
    env_file:
      - ../.env
    environment:
      USER_SERVICE_ADDR: "user-services:50051"
      SANDBOX_SERVICE_ADDR: "sandbox:50052"
      AI_COPILOT_SERVICE_ADDR: "ai-copilot:50053"
      AI_CHAT_SERVICE_ADDR: "ai-chat:50054"

volumes:
  mysql-data:
