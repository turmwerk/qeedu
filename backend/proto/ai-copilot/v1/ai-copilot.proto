syntax = "proto3";

package ai_copilot.v1;

option go_package = "github.com/dieWehmut/nju-edu-ai-system/backend/pkg/pb/ai-copilot/v1;aicopilotv1";

service AICopilotService {
  rpc Complete(CompleteRequest) returns (CompleteResponse);
}

message CompleteRequest {
  string language      = 1;
  string file_content  = 2;
  int32  cursor_offset = 3;
  string file_path     = 4;
  double temperature   = 5;
  int32  max_tokens    = 6;
  string model         = 7;
  string api_key       = 8;
  string base_url      = 9;
}

message CompleteResponse {
  string suggestion = 1;
}
