syntax = "proto3";

package user.v1;

option go_package = "github.com/dieWehmut/nju-edu-ai-system/backend/pkg/pb/user/v1;userv1";

service UserService {
  rpc FindOrCreateOAuthUser(FindOrCreateOAuthUserRequest) returns (FindOrCreateOAuthUserResponse);
  rpc FindOrCreateEmailUser(FindOrCreateEmailUserRequest) returns (FindOrCreateEmailUserResponse);
  rpc CreatePasswordUser(CreatePasswordUserRequest) returns (CreatePasswordUserResponse);
  rpc VerifyPassword(VerifyPasswordRequest) returns (VerifyPasswordResponse);
  rpc UpdatePassword(UpdatePasswordRequest) returns (UpdatePasswordResponse);
  rpc GetUserByID(GetUserByIDRequest) returns (GetUserByIDResponse);
  rpc GetUserByEmail(GetUserByEmailRequest) returns (GetUserByEmailResponse);
}

message OAuthProfile {
  string provider    = 1;
  string provider_id = 2;
  string name        = 3;
  string email       = 4;
  string avatar_url  = 5;
}

message User {
  uint64 id          = 1;
  string provider    = 2;
  string provider_id = 3;
  string name        = 4;
  string email       = 5;
  string avatar_url  = 6;
  int64  created_at  = 7;
  int64  updated_at  = 8;
}

message FindOrCreateOAuthUserRequest {
  OAuthProfile profile = 1;
}

message FindOrCreateOAuthUserResponse {
  User user = 1;
}

message FindOrCreateEmailUserRequest {
  string email = 1;
  string name  = 2;
}

message FindOrCreateEmailUserResponse {
  User user = 1;
}

message CreatePasswordUserRequest {
  string email    = 1;
  string name     = 2;
  string password = 3;
}

message CreatePasswordUserResponse {
  User user = 1;
}

message VerifyPasswordRequest {
  string account  = 1;
  string password = 2;
}

message VerifyPasswordResponse {
  User user = 1;
}

message UpdatePasswordRequest {
  string email        = 1;
  string new_password = 2;
}

message UpdatePasswordResponse {
  User user = 1;
}

message GetUserByIDRequest {
  uint64 id = 1;
}

message GetUserByIDResponse {
  User user = 1;
}

message GetUserByEmailRequest {
  string email = 1;
}

message GetUserByEmailResponse {
  User user = 1;
}
